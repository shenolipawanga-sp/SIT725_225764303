<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Catalog</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #fafafa; }
    h1 { color: #333; }
    ul { list-style: none; padding: 0; max-width: 500px; }
    li { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px 16px; margin-bottom: 10px; }
    .title { font-weight: bold; }
    .author { color: #666; }
  </style>
</head>
<body>
  <h1>Book Catalog</h1>
  <ul id="bookList"></ul>

  <script>
    fetch('/api/books')
      .then((res) => res.json())
      .then((result) => {
        const books = result.data;
        const list = document.getElementById('bookList');
        books.forEach((book) => {
          const item = document.createElement('li');
          item.innerHTML = `<span class="title">${book.title}</span> — <span class="author">${book.author}</span>`;
          list.appendChild(item);
        });
      })
      .catch((err) => console.error('Error fetching books:', err));
  </script>
</body>
</html>
