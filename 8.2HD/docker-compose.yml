services:
  mongo:
    image: mongo:7
    container_name: studybuddy-mongo
    volumes:
      - mongo-data:/data/db
    # config/db.js exits the process if the first connection attempt fails,
    # so the app must not start until Mongo is actually accepting connections.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Uncomment to inspect the database from Compass on the host.
    # ports:
    #   - "27017:27017"

  app:
    build: .
    container_name: studybuddy-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # "mongo" is the service name; Compose resolves it on the private network
      MONGO_URI: mongodb://mongo:27017/studybuddy
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data: